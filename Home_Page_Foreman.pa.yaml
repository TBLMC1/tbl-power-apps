Screens:
  Home_Page_Foreman:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// Load employee clock status cache once per session (cold start)
        If(
            IsEmpty(colEmployeeClockStatus),
            LoadData(colEmployeeClockStatus, "cachedClockStatus", true)
        );

        // Auto-sync any pending scans
        If(
            Connection.Connected && !IsEmpty(colSignIns),

            // Step 1 - Process Clock Ins first
            ForAll(
                Filter(colSignIns, Action = "Clock In" && !IsBlank(Customer) && !IsBlank(Class)) As item,
                Patch(
                    'Daily Logins',
                    Defaults('Daily Logins'),
                    {
                        Title: Text(item.ScanTime, "MM/dd/yyyy HH:mm:ss") & " - " & item.EmployeeName,
                        EmployeeName: item.EmployeeName,
                        QBTUserID: item.QBTUserID,
                        WorkDate: Date(Year(item.ScanTime), Month(item.ScanTime), Day(item.ScanTime)),
                        Day: {
                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                            Value: Text(item.ScanTime, "dddd")
                        },
                        TimeIn: DateAdd(
                            DateValue(Text(item.ScanTime, "mm/dd/yyyy")),
                            Round(DateDiff(DateValue(Text(item.ScanTime, "mm/dd/yyyy")), item.ScanTime, TimeUnit.Minutes) / 15, 0) * 15,
                            TimeUnit.Minutes
                        ),
                        Customer: Text(item.Customer),
                        Class: {
                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                            Value: Text(item.Class)
                        },
                        Notes: Coalesce(item.Notes, ""),
                        Location: item.Location
                    }
                )
            );

            // Step 2 - Force SharePoint refresh before processing Clock Outs
            ClearCollect(
                colDailyLoginsRefresh,
                Filter('Daily Logins', WorkDate = Today())
            );

            // Step 3 - Process Clock Outs using refreshed data
            ForAll(
                Filter(colSignIns, Action = "Clock Out" && !IsBlank(Customer) && !IsBlank(Class)) As item,
                With(
                    {
                        rec: LookUp(
                            colDailyLoginsRefresh,
                            EmployeeName = item.EmployeeName &&
                            WorkDate = Date(Year(item.ScanTime), Month(item.ScanTime), Day(item.ScanTime)) &&
                            IsBlank(TimeOut)
                        )
                    },
                    If(
                        !IsBlank(rec),
                        Patch(
                            'Daily Logins',
                            LookUp('Daily Logins', ID = rec.ID),
                            {
                                TimeOut: DateAdd(
                                    DateValue(Text(item.ScanTime, "mm/dd/yyyy")),
                                    Round(DateDiff(DateValue(Text(item.ScanTime, "mm/dd/yyyy")), item.ScanTime, TimeUnit.Minutes) / 15, 0) * 15,
                                    TimeUnit.Minutes
                                ),
                                Hours: Round(
                                    (DateAdd(
                                        DateValue(Text(item.ScanTime, "mm/dd/yyyy")),
                                        Round(DateDiff(DateValue(Text(item.ScanTime, "mm/dd/yyyy")), item.ScanTime, TimeUnit.Minutes) / 15, 0) * 15,
                                        TimeUnit.Minutes
                                    ) - rec.TimeIn) * 24,
                                    2
                                ),
                                Class: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                    Value: Text(item.Class)
                                },
                                Customer: Text(item.Customer),
                                ClockOutNotes: Coalesce(item.Notes, ""),
                                QBTVerifiedStatus: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                    Value: ""
                                }
                            }
                        ),
                        Notify("Clock-out not matched for " & item.EmployeeName & " - check Daily Logins", NotificationType.Error)
                    )
                )
            );

            // Step 4 - Refresh again for subsequent Clock Ins in same batch
            ClearCollect(
                colDailyLoginsRefresh,
                Filter('Daily Logins', WorkDate = Today())
            );

            // Step 5 - Update employee clock status cache from what we just synced (avoids SharePoint read lag)
            ForAll(
                Filter(colSignIns, Action = "Clock In" && !IsBlank(Customer) && !IsBlank(Class)) As item,
                If(
                    !IsEmpty(Filter(colEmployeeClockStatus, QBTUserID = item.QBTUserID)),
                    Patch(
                        colEmployeeClockStatus,
                        LookUp(colEmployeeClockStatus, QBTUserID = item.QBTUserID),
                        {IsClockedIn: true}
                    ),
                    Collect(colEmployeeClockStatus, {
                        QBTUserID: item.QBTUserID,
                        EmployeeName: item.EmployeeName,
                        IsClockedIn: true
                    })
                )
            );

            ForAll(
                Filter(colSignIns, Action = "Clock Out" && !IsBlank(Customer) && !IsBlank(Class)) As item,
                If(
                    !IsEmpty(Filter(colEmployeeClockStatus, QBTUserID = item.QBTUserID)),
                    Patch(
                        colEmployeeClockStatus,
                        LookUp(colEmployeeClockStatus, QBTUserID = item.QBTUserID),
                        {IsClockedIn: false}
                    ),
                    Collect(colEmployeeClockStatus, {
                        QBTUserID: item.QBTUserID,
                        EmployeeName: item.EmployeeName,
                        IsClockedIn: false
                    })
                )
            );

            SaveData(colEmployeeClockStatus, "cachedClockStatus");

            Clear(colSignIns);
            SaveData(colSignIns, "cachedSignIns");
            Notify("Pending scans synced!", NotificationType.Success)
        );

        // Location and weather
        Set(
            varLocationCoords,
            Text(Location.Latitude) & "," & Text(Location.Longitude)
        );

        If(
            !IsBlank(varLocationCoords) && varLocationCoords <> ",",
            Set(varWeatherResult, GetWeather.Run(varLocationCoords)),
            Notify("Waiting for location...", NotificationType.Warning)
        );

        Set(
            varTemperature,
            Text(varWeatherResult.temperature, "0") & "°F"
        );

        Set(varLocation, varWeatherResult.cityname)
