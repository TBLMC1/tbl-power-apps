      - chkApplyAllNotes:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Font: =Font.'Open Sans'
            Height: =71
            HoverColor: =RGBA(0, 18, 107, 1)
            Size: =14
            Text: ="Apply note to all employees"
            Width: =224
            X: =416
            Y: =310
      - txtMasterNote:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            Height: =177
            HintText: ="Enter note for all employees"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Visible: =chkApplyAllNotes.Value
            X: =40
            Y: =798
