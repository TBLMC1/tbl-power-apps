Screens:
  Login Landing Page:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Login Button:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(208, 81, 5, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=ClearCollect(colCachedUsers, 'List of User Logins');\r\n\r\nSet(\r\n    varUser,\r\n    LookUp(\r\n        colCachedUsers,\r\n        Lower(Title) = Lower(Trim('Username Input'.Text)) && Password = Trim('Password Input'.Text)\r\n    )\r\n);\r\n\r\nIf(\r\n    IsBlank(varUser),\r\n    Notify(\"Invalid username or password\", NotificationType.Error),\r\n    \r\n    ClearCollect(colCachedUser, {User: Trim('Username Input'.Text), Role: Text(varUser.Authorization.Value)});\r\n    SaveData(colCachedUser, \"cachedUser\");\r\n    \r\n    Switch(\r\n        Text(varUser.Authorization.Value),\r\n        \"Foremen\", Navigate(Home_Page_Foreman, ScreenTransition.Fade),\r\n        \"Safety\", Navigate(Home_Page_Safety, ScreenTransition.Fade),\r\n        \"Admin\", Navigate(Home_Page_Admin, ScreenTransition.Fade),\r\n        \"PM\", Navigate(Home_Page_PM, ScreenTransition.Fade),\r\n        Notify(\"Role not recognized\", NotificationType.Error)\r\n    )\r\n)"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Login"
            X: =180
            Y: =471
      - Password Input:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HintText: ="Enter Your Password"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =40
            Y: =337
      - Username Input:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HintText: ="Enter Your Username"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =40
            Y: =201
      - Logo Back:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(208, 81, 5, 1)
            Height: =161
            Width: =640
      - Company Logo:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =144
            Image: ='TBL Logo'
            Width: =640
            Y: =8
      - Label17:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =75
            Size: =14
            Text: ="v1.6.2 - "" & ""2026-09-02"
            Width: =173
            X: =425
            Y: =1030
