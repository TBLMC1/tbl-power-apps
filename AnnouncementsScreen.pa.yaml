Screens:
  AnnouncementsScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Rectangle4:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(208, 81, 5, 1)
            BorderThickness: =4
            Fill: =RGBA(255, 255, 255, 1)
            Height: =126
            Width: =640
      - Label12:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Text: ="Announcements"
            X: =40
            Y: =28
      - Icon3:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(0, 18, 107, 1)
            Icon: =Icon.BackArrow
            OnSelect: =Navigate(Home_Page_Foreman)
            Y: =137
      - galAnnouncements:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Items: |-
              =Filter(
                  colAnnouncements,
                  !(ID in colDismissedAnnouncements.ID),
                  "All" in TargetRole.Value || varUser.Authorization.Value in TargetRole.Value
              )
            Y: =216
          Children:
            - Rectangle6:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(255, 255, 255, 0)
                  Fill: =If(ThisItem.Priority.Value = "Urgent", Color.Red, ColorValue("#ffffff"))
                  Height: =103
                  OnSelect: =Select(Parent)
                  Width: =640
            - Label13:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =51.5
                  OnSelect: =Select(Parent)
                  Size: =16
                  Text: =ThisItem.Body
                  Width: =325
            - Label14:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =51
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =ThisItem.Body
                  Width: =325
                  Y: =51
            - Label14_1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(116, 116, 116, 1)
                  Font: =Font.'Open Sans'
                  Height: =51
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =Text(ThisItem.Created, "mm/dd/yyyy")
                  Width: =325
                  X: =315
                  Y: =52
            - Icon4:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Height: =51
                  Icon: =Icon.CancelBadge
                  OnSelect: |-
                    =Collect(colDismissedAnnouncements, {ID: ThisItem.ID});
                    SaveData(colDismissedAnnouncements, "cachedDismissed")
                  Width: =51.5
                  X: =587
      - Button7:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Set(varShowAnnouncementForm, true)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =16
            Text: ="+ New Announcement"
            X: =180
            Y: =1031
      - Rectangle9:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =1136
            Visible: =varShowAnnouncementForm
            Width: =640
      - Rectangle10:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =550
            Visible: =varShowAnnouncementForm
            Width: =500
            X: =70
            Y: =293
      - txtAnnouncementTitle:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =""
            Font: =Font.'Open Sans'
            HintText: ="Announcement title"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Visible: =varShowAnnouncementForm
            Width: =500
            X: =70
            Y: =293
      - txtAnnouncementBody:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =""
            Font: =Font.'Open Sans'
            Height: =51
            HintText: ="Announcement body"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Mode: =TextMode.MultiLine
            Visible: =varShowAnnouncementForm
            Width: =500
            X: =70
            Y: =362
      - ddAnnouncementPriority:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverFill: =RGBA(186, 202, 226, 1)
            Items: =["Normal", "Urgent"]
            Items.Value: =Value
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Visible: =varShowAnnouncementForm
            Width: =500
            X: =70
            Y: =483
      - dpAnnouncementExpiry:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            IconBackground: =RGBA(56, 96, 178, 1)
            IconFill: =RGBA(255, 255, 255, 1)
            Visible: =varShowAnnouncementForm
            Width: =500
            X: =70
            Y: =553
      - btnPostAnnouncement:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Patch(
                  'Announcement Board',
                  Defaults('Announcement Board'),
                  {
                      Title: Defaults('Announcement Board').Title,
                      Body: txtAnnouncementBody.Text,
                      Priority: {Value: ddAnnouncementPriority.Selected.Value},
                      Active: {Value: "Yes"},
                      ExpirationDate: dpAnnouncementExpiry.SelectedDate,
                      TargetRole: cmbAnnouncementRole.SelectedItems
                  }
              );
              Reset(txtAnnouncementTitle);
              Reset(txtAnnouncementBody);
              Reset(ddAnnouncementPriority);
              Reset(dpAnnouncementExpiry);
              Reset(cmbAnnouncementRole);
              Set(varShowAnnouncementForm, false);
              ClearCollect(
                  colAnnouncements,
                  Filter(
                      'Announcement Board',
                      Active.Value = "Yes",
                      IsBlank(ExpirationDate) || ExpirationDate >= Today()
                  )
              );
              Notify("Announcement posted!", NotificationType.Success)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Post Announcement"
            Visible: =varShowAnnouncementForm
            Width: =500
            X: =70
            Y: =623
      - btnCancelAnnouncement:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Reset(txtAnnouncementTitle);
              Reset(txtAnnouncementBody);
              Reset(ddAnnouncementPriority);
              Reset(dpAnnouncementExpiry);
              Reset(cmbAnnouncementRole);
              Set(varShowAnnouncementForm, false)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Cancel"
            Visible: =varShowAnnouncementForm
            X: =180
            Y: =722
      - cmbAnnouncementRole:
          Control: Classic/ComboBox@2.4.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            DisplayFields: =["Value"]
            Font: =Font.'Open Sans'
            HoverFill: =RGBA(186, 202, 226, 1)
            Items: |+
              =["All", "Foremen", "Safety", "Admin"]
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SearchFields: =["Value"]
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Visible: =varShowAnnouncementForm
            Width: =500
            X: =70
            Y: =413
