Screens:
  TSMC_Daily_Report_Home:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Logo_Back_TSMC_Daily_Report_Home:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(208, 81, 5, 1)
            Height: =161
            Width: =640
      - Company_Logo_TSMC_Daily_Report_Home:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =144
            Image: ='TBL Logo'
            OnSelect: =Navigate(Daily_Report_Home)
            Width: =640
            Y: =8
      - Button6:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            X: =40
            Y: =353
      - Text_Back_TSMC_Daily_report_Home:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(208, 81, 5, 1)
            BorderThickness: =5
            Fill: =RGBA(255, 255, 255, 1)
            Width: =560
            X: =40
            Y: =210
      - Select_Sub_Project_Text:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="Select Sub Project"
            X: =40
            Y: =225
