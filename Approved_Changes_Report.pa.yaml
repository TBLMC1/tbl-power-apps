Screens:
  Approved_Changes_Report:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - galApprovedChanges:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Items: |-
              =Sort(
                  Filter(
                      'Time Change Requests',
                      RequestStatus.Value = "Approved" && WorkDate = varYesterday
                  ),
                  EmployeeName
              )
          Children:
            - Separator9:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle21:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 18, 107, 1)
                  Height: =Parent.TemplateHeight - Separator9.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
            - lblReportName:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =53
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.EmployeeName & "  —  " & Text(ThisItem.WorkDate, "mmm d, yyyy")
                  Width: =636
                  X: =4
            - lblReportOriginal:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =51
                  OnSelect: =Select(Parent)
                  Size: =14
                  Text: |-
                    ="Original: " & If(IsBlank(ThisItem.OriginalTimeIn), "—", Text(ThisItem.OriginalTimeIn, "h:mm AM/PM")) & " to " & If(IsBlank(ThisItem.OriginalTimeOut), "—", Text(ThisItem.OriginalTimeOut, "h:mm AM/PM"))
                  Width: =260
                  X: =4
                  Y: =53
            - lblReportChanged:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =51
                  OnSelect: =Select(Parent)
                  Size: =15
                  Text: |-
                    ="Change to: " & Text(ThisItem.RequestedTimeIn, "h:mm AM/PM") & " to " & Text(ThisItem.RequestedTimeOut, "h:mm AM/PM")
                  Width: =319
                  X: =321
                  Y: =53
      - lblNoApprovedChanges:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="No approved changes for yesterday."
            Visible: =CountRows(Filter('Time Change Requests', RequestStatus.Value = "Approved" && WorkDate = varYesterday)) = 0
            X: =40
            Y: =622
      - btnBackFromReport:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Switch(
                  First(colCachedUser).Role,
                  "Admin", Navigate(Home_Page_Admin, ScreenTransition.Fade),
                  "PM", Navigate(Home_Page_PM, ScreenTransition.Fade),
                  Navigate(Home_Page_Admin, ScreenTransition.Fade)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="< Back"
            X: =180
            Y: =892
