Screens:
  Timesheets_Review:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =ClearCollect(
            colFlaggedForChange,
            Filter(
                Table({
                    RowKey: "",
                    EmployeeName: "",
                    QBTUserID: "",
                    WorkDate: "",
                    OriginalTimeIn: "",
                    OriginalTimeOut: "",
                    ChangeType: "",
                    RequestedTimeIn: "",
                    RequestedTimeOut: "",
                    Reason: ""
                }),
                false
            )
        );
        Set(varShowFlaggedPanel, false);
    Children:
      - galPreviousPeriod:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =313
            Items: |-
              =AddColumns(
                  GroupBy(
                      Filter(colHoursResults, DateValue(start) = varYesterday),
                      EmployeeName,
                      Segments
                  ),
                  TotalHours,
                  Sum(Filter(Segments, isUnpaidBreak = false && !IsBlank(end)), hours),
                  DayStart,
                  Min(Segments, DateTimeValue(start)),
                  DayEnd,
                  Max(Filter(Segments, !IsBlank(end)), DateTimeValue(end)),
                  date,
                  First(Segments).date,
                  QBTUserID,
                  First(Segments).QBTUserID
              )
            Y: =77
          Children:
            - lblDayRowPrev:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =Text(DateValue(ThisItem.date), "ddd, mmm d") & "  —  " & ThisItem.EmployeeName & "  —  " & Text(ThisItem.TotalHours, "0.00") & " hrs"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 173
                  Y: =
            - Separator5:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle14:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 18, 107, 1)
                  Height: =Parent.TemplateHeight - Separator5.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
            - chkFlagChangePrev:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =CountRows(Filter(colFlaggedForChange, RowKey = ThisItem.EmployeeName & "_" & Text(ThisItem.date))) > 0
                  Font: =Font.'Open Sans'
                  Height: =104
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: |-
                    =Collect(
                        colFlaggedForChange,
                        {
                            RowKey: ThisItem.EmployeeName & "_" & Text(ThisItem.date),
                            EmployeeName: ThisItem.EmployeeName,
                            QBTUserID: ThisItem.QBTUserID,
                            WorkDate: Text(ThisItem.date),
                            OriginalTimeIn: Text(ThisItem.DayStart, "h:mm AM/PM"),
                            OriginalTimeOut: Text(ThisItem.DayEnd, "h:mm AM/PM"),
                            ChangeType: "Adjust Time",
                            RequestedTimeIn: "",
                            RequestedTimeOut: "",
                            Reason: ""
                        }
                    )
                  OnUncheck: =RemoveIf(colFlaggedForChange, RowKey = ThisItem.EmployeeName & "_" & Text(ThisItem.date))
                  Text: =
                  Width: =68
                  X: =571
      - Rectangle13_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            BorderThickness: =5
            Fill: =RGBA(255, 255, 255, 1)
            Height: =77
            Width: =640
      - Label21_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =77
            Text: ="Yesterday"
            Width: =640
      - btnReviewFlagged:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Set(varShowFlaggedPanel, true)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Review Flagged (" & CountRows(colFlaggedForChange) & ")"
            Visible: =CountRows(colFlaggedForChange) > 0
            Width: =253
            X: =345
            Y: =795
      - btnBackToHome:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: |-
              =If(
                  CountRows(colFlaggedForChange) > 0,
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(Home_Page_Foreman, ScreenTransition.Fade)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="< Back"
            Width: =253
            X: =50
            Y: =1016
      - Label22:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Submit or remove flagged items to go back"
            Visible: =CountRows(colFlaggedForChange) > 0
            Width: =253
            X: =50
            Y: =795
      - grpFlaggedOverlay:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =865
            Visible: =varShowFlaggedPanel
            Width: =640
          Children:
            - Rectangle16:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(166, 166, 166, 1)
                  Height: =865
                  Width: =640
            - galFlaggedItems:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =865
                  Items: =colFlaggedForChange
                  TemplateSize: =180
                Children:
                  - lblFlagHeader:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                        Height: =45
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |-
                          =ThisItem.EmployeeName & "  —  " & ThisItem.WorkDate & "  (was " & ThisItem.OriginalTimeIn & " to " & ThisItem.OriginalTimeOut & ")" &
                          If(
                              IsBlank(ThisItem.ChangeType) || ThisItem.ChangeType = "" ||
                              IsBlank(ThisItem.RequestedTimeIn) || ThisItem.RequestedTimeIn = "" ||
                              IsBlank(ThisItem.RequestedTimeOut) || ThisItem.RequestedTimeOut = "" ||
                              IsBlank(ThisItem.Reason) || ThisItem.Reason = "",
                              "  ⚠ Incomplete",
                              ""
                          )
                        VerticalAlign: =VerticalAlign.Top
                        Width: =636
                        X: =4
                        Y: =
                  - Separator6:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =8
                        OnSelect: =Select(Parent)
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - Self.Height
                  - Rectangle15:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(0, 18, 107, 1)
                        Height: =Parent.TemplateHeight - Separator6.Height
                        OnSelect: =Select(Parent)
                        Visible: =ThisItem.IsSelected
                        Width: =4
                  - ddChangeType:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        Default: ="Adjust Time"
                        Font: =Font.'Open Sans'
                        Height: =51
                        HoverFill: =RGBA(186, 202, 226, 1)
                        Items: |-
                          =Table(
                              { Value: "Adjust Time" }
                          )
                        Items.Value: =Value
                        OnChange: |-
                          =UpdateIf(
                              colFlaggedForChange,
                              RowKey = ThisItem.RowKey,
                              { ChangeType: ddChangeType.Selected.Value }
                          )
                        OnSelect: =Select(Parent)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Width: =210
                        X: =4
                        Y: =121
                  - txtRequestedTimeIn:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =ThisItem.RequestedTimeIn
                        Font: =Font.'Open Sans'
                        Height: =56
                        HintText: ="Requested time in (e.g. 7:00 AM)"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        OnChange: |-
                          =UpdateIf(
                              colFlaggedForChange,
                              RowKey = ThisItem.RowKey,
                              { RequestedTimeIn: Trim(txtRequestedTimeIn.Text) & If(!IsBlank(ddTimeInAMPM.Selected.Value), " " & ddTimeInAMPM.Selected.Value, "") }
                          )
                        Size: =9.5
                        Width: =182
                        Y: =45
                  - txtRequestedTimeOut:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =ThisItem.RequestedTimeOut
                        Font: =Font.'Open Sans'
                        Height: =56
                        HintText: ="Requested time out (e.g. 3:30)"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        OnChange: |-
                          =UpdateIf(
                              colFlaggedForChange,
                              RowKey = ThisItem.RowKey,
                              { RequestedTimeOut: Trim(txtRequestedTimeOut.Text) & If(!IsBlank(ddTimeOutAMPM.Selected.Value), " " & ddTimeOutAMPM.Selected.Value, "") }
                          )
                        Size: =9.5
                        Width: =214
                        X: =330
                        Y: =45
                  - txtReason:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =ThisItem.Reason
                        Font: =Font.'Open Sans'
                        Height: =51
                        HintText: ="Reason for change"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        Mode: =TextMode.MultiLine
                        OnChange: |-
                          =UpdateIf(
                              colFlaggedForChange,
                              RowKey = ThisItem.RowKey,
                              { Reason: txtReason.Text }
                          )
                        OnSelect: =Select(Parent)
                        Size: =13
                        Width: =406
                        X: =234
                        Y: =121
                  - ddTimeOutAMPM:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        Default: |-
                          =If(
                              IsBlank(ThisItem.RequestedTimeOut),
                              Blank(),
                              Last(Split(ThisItem.RequestedTimeOut, " ")).Value
                          )
                        Font: =Font.'Open Sans'
                        Height: =56
                        HoverFill: =RGBA(186, 202, 226, 1)
                        Items: =Table({Value:"AM"},{Value:"PM"})
                        Items.Value: =Value
                        OnChange: |-
                          =UpdateIf(
                              colFlaggedForChange,
                              RowKey = ThisItem.RowKey,
                              { RequestedTimeOut: Trim(First(Split(ThisItem.RequestedTimeOut, " ")).Value) & " " & ddTimeOutAMPM.Selected.Value }
                          )
                        OnSelect: =Select(Parent)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Size: =14
                        Width: =100
                        X: =540
                        Y: =45
                  - ddTimeInAMPM:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        Default: |-
                          =If(
                              IsBlank(ThisItem.RequestedTimeIn),
                              Blank(),
                              Last(Split(ThisItem.RequestedTimeIn, " ")).Value
                          )
                        Font: =Font.'Open Sans'
                        Height: =56
                        HoverFill: =RGBA(186, 202, 226, 1)
                        Items: =Table({Value:"AM"},{Value:"PM"})
                        Items.Value: =Value
                        OnChange: |-
                          =UpdateIf(
                              colFlaggedForChange,
                              RowKey = ThisItem.RowKey,
                              { RequestedTimeIn: Trim(First(Split(ThisItem.RequestedTimeIn, " ")).Value) & " " & ddTimeInAMPM.Selected.Value }
                          )
                        OnSelect: =Select(Parent)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Size: =14
                        Width: =100
                        X: =182
                        Y: =45
            - btnSubmitAll:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |-
                    =If(
                        CountRows(
                            Filter(
                                colFlaggedForChange,
                                IsBlank(ChangeType) || ChangeType = "" ||
                                IsBlank(RequestedTimeIn) || RequestedTimeIn = "" ||
                                IsBlank(RequestedTimeOut) || RequestedTimeOut = "" ||
                                IsBlank(Reason) || Reason = ""
                            )
                        ) > 0,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =Set(varSubmitCount, CountRows(colFlaggedForChange));
                    ForAll(
                        colFlaggedForChange As flagged,
                        Patch(
                            'Time Change Requests',
                            Defaults('Time Change Requests'),
                            {
                                EmployeeName: flagged.EmployeeName,
                                QBTUserID: flagged.QBTUserID,
                                WorkDate: DateValue(flagged.WorkDate),
                                ChangeType: { Value: flagged.ChangeType },
                                OriginalTimeIn: If(
                                    IsBlank(flagged.OriginalTimeIn) || flagged.OriginalTimeIn = "Still clocked in",
                                    Blank(),
                                    DateTimeValue(flagged.WorkDate & " " & flagged.OriginalTimeIn)
                                ),
                                OriginalTimeOut: If(
                                    IsBlank(flagged.OriginalTimeOut) || flagged.OriginalTimeOut = "Still clocked in",
                                    Blank(),
                                    DateTimeValue(flagged.WorkDate & " " & flagged.OriginalTimeOut)
                                ),
                                RequestedTimeIn: If(
                                    IsBlank(flagged.RequestedTimeIn),
                                    Blank(),
                                    DateTimeValue(flagged.WorkDate & " " & flagged.RequestedTimeIn)
                                ),
                                RequestedTimeOut: If(
                                    IsBlank(flagged.RequestedTimeOut),
                                    Blank(),
                                    DateTimeValue(flagged.WorkDate & " " & flagged.RequestedTimeOut)
                                ),
                                Reason: flagged.Reason,
                                RequestedBy: User().FullName,
                                RequestStatus: { Value: "Pending" }
                            }
                        )
                    );
                    Clear(colFlaggedForChange);
                    Set(varShowFlaggedPanel, false);
                    Notify("Submitted " & varSubmitCount & " change request(s).", NotificationType.Success)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Submit All"
                  X: =337
                  Y: =781
            - btnCancelFlagged:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =Clear(colFlaggedForChange);
                    Set(varShowFlaggedPanel, false)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Cancel"
                  X: =27
                  Y: =781
            - lblSubmitHint:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =110
                  Text: ="Fill in change type, requested times, and reason for every flagged row before submitting."
                  Visible: |-
                    =CountRows(
                        Filter(
                            colFlaggedForChange,
                            IsBlank(ChangeType) || ChangeType = "" ||
                            IsBlank(RequestedTimeIn) || RequestedTimeIn = "" ||
                            IsBlank(RequestedTimeOut) || RequestedTimeOut = "" ||
                            IsBlank(Reason) || Reason = ""
                        )
                    ) > 0
                  Width: =593
                  X: =27
                  Y: =669
