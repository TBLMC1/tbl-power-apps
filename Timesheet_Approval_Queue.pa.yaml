Screens:
  Timesheet_Approval_Queue:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =If(
            CountRows(Filter('Time Change Requests', RequestStatus.Value = "Pending")) = 0,
            Notify("No pending timesheet requests right now.", NotificationType.Success)
        )
    Children:
      - galPendingRequests:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =808
            Items: |-
              =Sort(
                  Filter('Time Change Requests', RequestStatus.Value = "Pending"),
                  WorkDate
              )
            TemplateSize: =411
          Children:
            - Separator7:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle17:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 18, 107, 1)
                  Height: =Parent.TemplateHeight - Separator7.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
            - Rectangle18:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(56, 96, 178, 1)
                  BorderThickness: =5
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =46
                  OnSelect: =Select(Parent)
                  Width: =640
                  Y: =20
            - lblRequestSummary:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =46
                  Size: =14
                  Text: =ThisItem.EmployeeName & "  —  " & Text(ThisItem.WorkDate, "mmm d, yyyy") & "  —  " & ThisItem.ChangeType.Value
                  Width: =636
                  X: =4
                  Y: =20
            - Rectangle18_1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(56, 96, 178, 1)
                  BorderThickness: =5
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =46
                  OnSelect: =Select(Parent)
                  Width: =640
                  Y: =80
            - Rectangle18_2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(56, 96, 178, 1)
                  BorderThickness: =5
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =42
                  OnSelect: =Select(Parent)
                  Width: =640
                  Y: =145
            - lblRequestDetail:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =58
                  OnSelect: =Select(Parent)
                  Size: =14
                  Text: |-
                    ="Original: " & If(IsBlank(ThisItem.OriginalTimeIn), "—", Text(ThisItem.OriginalTimeIn, "h:mm AM/PM")) & " to " & If(IsBlank(ThisItem.OriginalTimeOut), "—", Text(ThisItem.OriginalTimeOut, "h:mm AM/PM")) &
                    "   Requested: " & Text(ThisItem.RequestedTimeIn, "h:mm AM/PM") & " to " & Text(ThisItem.RequestedTimeOut, "h:mm AM/PM")
                  X: =4
                  Y: =74
            - lblRequestReason:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =38
                  OnSelect: =Select(Parent)
                  Size: =14
                  Text: |-
                    ="Reason: " & ThisItem.Reason & "   —   Requested by: " & ThisItem.RequestedBy
                  Y: =145
            - Rectangle19:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Fill: =RGBA(0, 0, 0, 1)
                  Height: =20
                  OnSelect: =Select(Parent)
                  Width: =640
            - Rectangle19_1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Fill: =RGBA(0, 0, 0, 1)
                  Height: =20
                  OnSelect: =Select(Parent)
                  Width: =640
                  Y: =377
            - btnApprove:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(141, 198, 63, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =Patch(
                        'Time Change Requests',
                        ThisItem,
                        {
                            RequestStatus: { Value: "Approved" },
                            ReviewedBy: User().FullName,
                            AdminNote: txtAdminNote.Text
                        }
                    );
                    Notify("Approved " & ThisItem.EmployeeName & "'s request for " & Text(ThisItem.WorkDate, "mmm d, yyyy") & ".", NotificationType.Success)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Approve"
                  X: =18
                  Y: =204
            - btnReject:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(168, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =Patch(
                        'Time Change Requests',
                        ThisItem,
                        {
                            RequestStatus: { Value: "Rejected" },
                            ReviewedBy: User().FullName,
                            AdminNote: txtAdminNote.Text
                        }
                    );
                    Notify("Rejected " & ThisItem.EmployeeName & "'s request for " & Text(ThisItem.WorkDate, "mmm d, yyyy") & ".", NotificationType.Warning)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Reject"
                  X: =331
                  Y: =203
            - txtAdminNote:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =
                  Font: =Font.'Open Sans'
                  HintText: ="Note for foreman (optional on approve, recommended on reject)"
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Mode: =TextMode.MultiLine
                  OnSelect: =Select(Parent)
                  Size: =14
                  Width: =593
                  X: =18
                  Y: =288
      - lblEmptyState:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="No pending timesheet requests."
            Visible: =CountRows(Filter('Time Change Requests', RequestStatus.Value = "Pending")) = 0
            X: =40
            Y: =853
      - Button19:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Switch(
                  First(colCachedUser).Role,
                  "Admin", Navigate(Home_Page_Admin, ScreenTransition.Fade),
                  "PM", Navigate(Home_Page_PM, ScreenTransition.Fade),
                  Navigate(Home_Page_Admin, ScreenTransition.Fade)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="< Back to Home"
            X: =180
            Y: =968
